<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Crypto-Bit Hacker V0.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#00ff41;font-family:"Courier New",Courier,monospace;font-size:16px;font-weight:400;text-shadow:0 0 5px #00ff41;overflow:hidden}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(#00ff4109 1px,transparent 1px),linear-gradient(90deg,#00ff4109 1px,transparent 1px);background-size:35px 35px;pointer-events:none}.top{height:86px;border-bottom:1px solid #00ff41;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:#001000ee}.balance{text-align:right}.balance b{font-size:25px}.small{font-size:11px;opacity:.65}.history{margin-top:5px;padding:4px 8px;font-size:10px}.terminal{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:min(700px,88%);border:1px solid #00ff41;padding:22px;background:#001000b0;line-height:1.7}button{font-family:"Courier New",Courier,monospace;font-size:14px;font-weight:bold;color:#00ff41;background:#001600;border:2px solid #00ff41;padding:12px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 8px #00ff4144}button:hover:not(:disabled){background:#00ff41;color:#000}button:disabled{opacity:.35;cursor:not-allowed}.leftBtns,.rightBtns{position:fixed;bottom:25px;display:flex;flex-direction:column;gap:10px}.leftBtns{left:25px}.rightBtns{right:25px;align-items:stretch}.mainbtn{width:180px;height:58px}.hack{height:75px;font-size:20px}.firewall{border-color:#ff3131;color:#ff4545;text-shadow:0 0 5px #f33;box-shadow:0 0 8px #f334}.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:20}.win{display:none;position:fixed;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);width:min(760px,92vw);max-height:80vh;background:#020902;border:2px solid #00ff41;box-shadow:0 0 30px #00ff4166}.title{height:42px;background:#001b07;border-bottom:1px solid #00ff41;display:flex;justify-content:space-between;align-items:center;padding-left:14px}.close{height:100%;width:50px;border:0;border-left:1px solid #00ff41;font-size:20px}.content{padding:18px;overflow:auto;max-height:calc(80vh - 42px)}.card{border:1px solid #00ff4188;padding:15px;margin:12px 0}.card h3{margin:0 0 7px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.red{border-color:#ff3131}.red .title{border-color:#ff3131;background:#190000;color:#ff4545}.red .close{border-color:#ff3131;color:#ff4545}.notice{color:#ff4545;text-shadow:0 0 6px red}.gain{position:fixed;font-weight:bold;pointer-events:none;z-index:50;animation:up .8s forwards}@keyframes up{to{opacity:0;transform:translateY(-60px)}}input{background:#000;color:#00ff41;border:1px solid #00ff41;padding:9px;font:inherit;width:100%}.mission{cursor:pointer}.mission:hover{background:#002b0c}.problem{font-size:24px;text-align:center;margin:20px}.statusline{opacity:.7;font-size:12px}@media(max-width:600px){.terminal{top:110px}.mainbtn{width:145px}.leftBtns{left:12px;bottom:12px}.rightBtns{right:12px;bottom:12px}.top{padding:0 12px}.brand{font-size:12px}}
</style></head><body>
<header class='top'><b class='brand'>&gt; CRYPTO_BIT://TERMINAL [V0.3]</b><div class='balance'><span class='small'>CRYPTO-BIT BALANCE</span><br><b id='bal'>$0</b><br><button class='history' onclick="openWin('historyWin');renderHistory()">UPGRADE HISTORY</button></div></header>
<main class='terminal'><div class='small'>root@cryptobit:~/network</div><hr><p>&gt; Secure connection initialized...</p><p>&gt; Crypto-Bit miner ready.</p><p id='sys' class='statusline'>[SYSTEM] Hack to generate Crypto-Bit.</p><p>root@cryptobit:~$ █</p></main>
<div class='leftBtns'><button class='mainbtn' onclick="openElite()">ELITE HaX</button><button class='mainbtn' onclick="openWin('upWin');renderUpgrades()">UPGRADES</button></div>
<div class='rightBtns'><button class='mainbtn firewall' onclick="openWin('fwWin');renderFirewall()">FIREWALL</button><button id='hack' class='mainbtn hack' onclick='doHack()'>HACK</button></div><div id='overlay' class='overlay'></div>
<div id='upWin' class='win'><div class='title'>UPGRADES.exe<button class='close' onclick='closeWins()'>×</button></div><div id='upContent' class='content'></div></div>
<div id='historyWin' class='win'><div class='title'>UPGRADE_HISTORY.log<button class='close' onclick='closeWins()'>×</button></div><div class='content'><input id='histSearch' placeholder='Search purchased upgrades...' oninput='renderHistory()'><div id='histContent'></div></div></div>
<div id='fwWin' class='win red'><div class='title'>FIREWALL.exe<button class='close' onclick='closeWins()'>×</button></div><div id='fwContent' class='content'></div></div>
<div id='eliteWin' class='win'><div class='title'>ELITE_HaX.exe<button class='close' onclick='closeWins()'>×</button></div><div id='eliteContent' class='content'></div></div>
<script>
const K='cbGameV03';let d=JSON.parse(localStorage.getItem(K)||'null')||{cb:0,safety:100,owned:{},hackCount:0,raidUntil:0,eliteCooldown:0,eliteRefresh:0,missions:[],passesDay:'',passes:0};
// migrate V0.2 saves
if(!localStorage.getItem(K)){d.cb=Number(localStorage.getItem('cryptoBits'))||0;if(+localStorage.getItem('binaryOwned'))d.owned[1]=1;if(+localStorage.getItem('malwareOwned'))d.owned[2]=+localStorage.getItem('malwareOwned');if(+localStorage.getItem('hackerOwned'))d.owned[3]=1}
const upgrades={1:{n:"0's, 1's, and 2's!",base:30,max:1,desc:'Clicks are now more effective... Most of the time.',effect:'Each click: 1% → 0 CB, 32% → 1 CB, 67% → 2 CB.'},2:{n:'Malware 102',base:69,max:5,desc:'Malware can help you automine 0.1 CB/Sec!',effect:'+0.1 CB/sec per level.'},3:{n:'Hacker! (No duh)',base:404,max:1,req:1,desc:'Better Mouse=Better Clicks.',effect:'Replaces Upgrade #1 click RNG. Every click gives a guaranteed base 2 CB.'},4:{n:'Click on This Suspicious Ad!',base:666,max:1,req:2,desc:'Those pop-up ads you see in the internet......',effect:'Every 10th click is a Golden Click worth ×3 its predetermined click value.'},5:{n:'EZPZ',base:1000,max:Infinity,desc:'Base value of every click is INCREASED by 0.1x.',effect:'Adds +0.1× to click value per level; result rounds up to tenths.'},6:{n:'NotInternetExplorer',base:1300,max:1,req:4,desc:'I told you, Mom!',effect:'Each hack permanently adds +0.00001% CB to the next hack; final reward rounds up to a whole CB.'},7:{n:'FPS Enhancer',base:1500,max:Infinity,desc:'Time to start Dashing in Geometric style!',effect:'Raises maximum CB balance by 5,000 per level.'}};
function save(){localStorage.setItem(K,JSON.stringify(d))}function lvl(i){return d.owned[i]||0}function maxBal(){return 3000+5000*lvl(7)}function cap(){d.cb=Math.min(d.cb,maxBal())}function fmt(x){return x.toLocaleString(undefined,{maximumFractionDigits:1})}function update(){cap();document.getElementById('bal').textContent='$'+fmt(d.cb);document.getElementById('hack').disabled=Date.now()<d.raidUntil;save()}function cost(i){return Math.ceil(upgrades[i].base*Math.pow(5,lvl(i)))}function available(i){let u=upgrades[i];return lvl(i)<u.max&&(!u.req||lvl(u.req)>0)}
function openWin(id){document.getElementById('overlay').style.display='block';document.getElementById(id).style.display='block'}function closeWins(){document.getElementById('overlay').style.display='none';document.querySelectorAll('.win').forEach(x=>x.style.display='none')}
function renderUpgrades(){let h='';for(let i=1;i<=7;i++){if(!available(i))continue;let u=upgrades[i],c=cost(i);h+=`<div class=card><h3>Upgrade #${i}: ${u.n}</h3><p>${u.desc}</p><div class=row><span>COST: $${c.toLocaleString()}<br>OWNED: ${lvl(i)}${u.max!==Infinity?'/'+u.max:''}</span><button ${d.cb<c?'disabled':''} onclick='buy(${i})'>BUY</button></div></div>`}document.getElementById('upContent').innerHTML=h||'<p>No upgrades are currently available.</p>'}
function buy(i){let c=cost(i);if(!available(i)||d.cb<c)return;d.cb-=c;d.owned[i]=lvl(i)+1;update();renderUpgrades()}
function renderHistory(){let q=(document.getElementById('histSearch')?.value||'').toLowerCase(),h='';for(let i=1;i<=7;i++){if(!lvl(i))continue;let u=upgrades[i];if((u.n+' '+u.effect+' '+i).toLowerCase().includes(q))h+=`<div class=card><h3>Upgrade #${i}: ${u.n}</h3><p>${u.effect}</p><span class=small>OWNED: ${lvl(i)}</span></div>`}document.getElementById('histContent').innerHTML=h||'<p>No matching purchased upgrades.</p>'}
function reward(){let r=1;if(lvl(3))r=2;else if(lvl(1)){let x=Math.random()*100;r=x<1?0:x<33?1:2}r=Math.ceil((r*(1+.1*lvl(5)))*10)/10;if(lvl(6))r=Math.ceil(r*(1+d.hackCount*.0000001));d.hackCount++;if(lvl(4)&&d.hackCount%10===0)r*=3;return r}
function doHack(){if(Date.now()<d.raidUntil)return;let r=reward();d.cb+=r;cap();let b=document.getElementById('hack').getBoundingClientRect(),g=document.createElement('div');g.className='gain';g.textContent='+$'+fmt(r);g.style.left=(b.left+b.width/2)+'px';g.style.top=(b.top-10)+'px';document.body.appendChild(g);setTimeout(()=>g.remove(),800);update()}
function renderFirewall(){let raid=Math.max(0,Math.ceil((d.raidUntil-Date.now())/1000));document.getElementById('fwContent').innerHTML=`<h2>SAFETY: ${d.safety}%</h2><p>Transfer Crypto-Bits into firewall protection.</p><p>1 Safety% = 2 CB</p><input id='safeAmt' type=number min=1 max='${100-d.safety}' placeholder='Safety % to purchase'><br><br><button onclick='buySafety()'>TRANSFER</button>${raid?`<p class=notice>RAID ACTIVE — CB generation disabled for ${raid}s.</p>`:''}`}
function buySafety(){let a=Math.floor(+document.getElementById('safeAmt').value);if(!a||a<1)return;a=Math.min(a,100-d.safety);if(d.cb<a*2)return;d.cb-=a*2;d.safety+=a;update();renderFirewall()}
setInterval(()=>{if(Math.random()<.2)d.safety=Math.max(0,d.safety-(1+Math.floor(Math.random()*5)));save()},15000);let lowTicks=0;setInterval(()=>{if(d.safety<=10&&Date.now()>=d.raidUntil){lowTicks++;let chance=1+Math.floor(lowTicks/5);if(Math.random()*100<chance){d.cb*=.3;d.raidUntil=Date.now()+30000;lowTicks=0;document.getElementById('sys').innerHTML='<span class=notice>[RAID NOTICE] 70% CB seized. Mining locked for 30 seconds.</span>'}}else lowTicks=0;update();if(document.getElementById('fwWin').style.display==='block')renderFirewall()},1000);
setInterval(()=>{if(Date.now()>=d.raidUntil&&lvl(2)){d.cb+=.1*lvl(2);update()}},1000);
const nouns=['Bank','Store','RichGuy','Train','Cryptobase','Server','Vault','Market','Casino','Company','Wallet','Exchange'];function missionName(){return nouns[Math.floor(Math.random()*nouns.length)]+'_'+String(Math.floor(Math.random()*1000)).padStart(3,'0')}function refreshMissions(){let ps=[.2,.33,.5,.69,.66,.7,.75,.1];d.missions=Array.from({length:3},()=>({name:missionName(),reward:Math.ceil(d.cb*ps[Math.floor(Math.random()*ps.length)])}));d.eliteRefresh=Date.now()+1800000;save()}
function day(){return new Date().toISOString().slice(0,10)}function openElite(){openWin('eliteWin');if(d.passesDay!==day()){d.passesDay=day();d.passes=0}if(!d.missions.length||Date.now()>=d.eliteRefresh)refreshMissions();renderElite()}
function renderElite(){let cd=Math.max(0,Math.ceil((d.eliteCooldown-Date.now())/60000));let h=`<p>DAILY PASSES: ${d.passes}/5</p>`;if(cd>0)h+=`<p class=notice>COOLDOWN: ${cd} minute(s)</p>`;else if(d.passes>=5)h+='<p>Daily mission pass limit reached.</p>';else d.missions.forEach((m,i)=>h+=`<div class='card mission' onclick='startMission(${i})'><h3>${m.name}</h3><p>REWARD: $${m.reward.toLocaleString()}</p></div>`);h+=`<p class=small>Mission list refresh: ${Math.max(0,Math.ceil((d.eliteRefresh-Date.now())/60000))} min</p>`;document.getElementById('eliteContent').innerHTML=h}
let active=null;function problem(k){if(k===4){let root=11+Math.floor(Math.random()*34),sq=root*root;return {q:`√${sq}`,a:root}}let a=10+Math.floor(Math.random()*90),b=10+Math.floor(Math.random()*90),op=['×','+','−'][Math.floor(Math.random()*3)];return {q:`${a} ${op} ${b}`,a:op==='×'?a*b:op==='+'?a+b:a-b}}
function startMission(i){if(Date.now()<d.eliteCooldown||d.passes>=5)return;active={m:d.missions[i],step:0,problems:Array.from({length:5},(_,k)=>problem(k))};showProblem()}
function showProblem(){let p=active.problems[active.step];document.getElementById('eliteContent').innerHTML=`<h2>${active.m.name}</h2><p>TASK ${active.step+1}/5</p><div class=problem>${p.q} = ?</div><input id=ans type=number autofocus><br><br><button onclick='answer()'>SUBMIT</button><p class=small>One wrong answer fails the entire mission.</p>`}
function answer(){let v=Number(document.getElementById('ans').value),p=active.problems[active.step];if(v!==p.a){d.eliteCooldown=Date.now()+5400000;save();active=null;renderElite();return}active.step++;if(active.step<5){showProblem();return}d.cb+=active.m.reward;d.passes++;d.eliteCooldown=Date.now()+1800000;active=null;update();renderElite()}
update();setInterval(()=>{if(document.getElementById('upWin').style.display==='block')renderUpgrades();if(document.getElementById('eliteWin').style.display==='block'&&!active)renderElite()},1000);
</script></body></html>
